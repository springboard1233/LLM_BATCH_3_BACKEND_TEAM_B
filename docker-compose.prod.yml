version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:7.0
    container_name: fraud_mongodb_prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-backend_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-aBWmEIMJPz3yLIgq}
      MONGO_INITDB_DATABASE: bfsidata
    volumes:
      - mongodb_data_prod:/data/db
      - mongodb_config_prod:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraud_network_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: fraud_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraud_network_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_backend_prod
    restart: always
    environment:
      MONGO_URI: "mongodb://${MONGO_USER:-backend_user}:${MONGO_PASSWORD:-aBWmEIMJPz3yLIgq}@mongodb:27017/bfsidata?authSource=admin"
      MONGO_DB_NAME: bfsidata
      PREDICTION_COLLECTION: predictions
      TRANSACTION_COLLECTION: transactions
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MODEL_PATH: ./models/random_forest_model.pkl
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    networks:
      - fraud_network_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongodb_data_prod:
    driver: local
  mongodb_config_prod:
    driver: local
  redis_data_prod:
    driver: local

networks:
  fraud_network_prod:
    driver: bridge
